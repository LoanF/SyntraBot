# Services d'infrastructure (dev). Les apps (bot/api/web) auront leur Dockerfile multi-stage pour la prod.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: syntra
      POSTGRES_PASSWORD: syntra
      POSTGRES_DB: syntra
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntra"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]

  # BDD FiveM factice pour les tests d'intégration de la fiche joueur
  fivem-db:
    image: mariadb:11
    profiles: ["test"]
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: fivem
    ports: ["3307:3306"]

volumes:
  pgdata:
  redisdata:
