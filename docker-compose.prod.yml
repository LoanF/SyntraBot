# Déploiement de production : docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Voir docs/DEPLOY.md. Aucun port applicatif n'est exposé : seul Caddy (80/443) l'est, avec TLS automatique.
name: syntra

x-app: &app
  restart: unless-stopped
  env_file: ${ENV_FILE:-.env.prod}
  depends_on:
    migrate: { condition: service_completed_successfully }
    redis: { condition: service_started }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: syntra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?définir POSTGRES_PASSWORD}
      POSTGRES_DB: syntra
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntra"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]

  migrate:
    image: syntra-migrate:${IMAGE_TAG:-latest}
    build: { context: ., target: migrate }
    env_file: ${ENV_FILE:-.env.prod}
    depends_on: { postgres: { condition: service_healthy } }
    restart: "no"

  bot:
    <<: *app
    image: syntra-bot:${IMAGE_TAG:-latest}
    build: { context: ., target: bot }

  api:
    <<: *app
    image: syntra-api:${IMAGE_TAG:-latest}
    build: { context: ., target: api }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      retries: 5

  web:
    <<: *app
    image: syntra-web:${IMAGE_TAG:-latest}
    build: { context: ., target: web }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # HTTP seulement : le TLS est géré par le reverse proxy (HAProxy) qui renvoie ici
    ports: ["${HTTP_PORT:-8080}:80"]
    environment:
      WEB_DOMAIN: ${WEB_DOMAIN:?définir WEB_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?définir API_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web, api]

volumes:
  pgdata:
  redisdata:
  caddy_data:
